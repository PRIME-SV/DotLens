<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DotLens</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <div class="popup-header">
    <div class="brand"><span class="logo">●</span> DotLens <span class="badge">FOR X</span></div>
    <label class="enable-control"><span id="enabled-label">On</span><input id="enabled" type="checkbox" role="switch" aria-label="Enable DotLens" disabled></label>
  </div>
  <div class="popup-controls">
    <label for="profile">Profile</label>
    <select id="profile" disabled><option value="1">Profile 1</option><option value="2">Profile 2</option></select>
  </div>
  <p id="control-status" role="status" aria-live="polite"></p>
  <h1>Today's focus <span class="scope">All profiles</span></h1>
  <div class="popup-grid">
    <article class="card metric"><span class="metric-label">Posts hidden</span><strong id="hidden">0</strong></article>
    <article class="card metric"><span class="metric-label">Time saved · est.</span><strong id="saved">0 sec</strong></article>
  </div>
  <p class="muted" id="out">Browse X to start tracking.</p>
  <button class="primary" id="opt">Open focus dashboard ↗</button>
  <p class="footnote" id="note">Analytics stay on this device.</p>
  <script src="profiles.js"></script>
  <script src="dashboard-model.js"></script>
  <script src="popup.js"></script>
</body>
</html>
